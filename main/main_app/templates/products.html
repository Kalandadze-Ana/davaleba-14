{% extends 'base.html' %}

{% block title %}Products - MyShop{% endblock %}

{% block content %}
<style>
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }

    .card {
        display: block;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        color: inherit;
        transition: box-shadow 0.2s, transform 0.2s;
    }
    .card:hover { box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1); transform: translateY(-4px); }

    .card .thumb { height: 170px; font-size: 4rem; }
    .card-body { padding: 18px 20px 20px; }
    .card-body h3 { margin: 10px 0 6px; font-size: 1.1rem; }
    .card-price { font-size: 1.25rem; font-weight: 800; color: var(--accent); margin: 0; }

    .empty { text-align: center; padding: 60px 20px; background: var(--card); border: 1px dashed var(--border); border-radius: 16px; color: var(--muted); }
</style>

<h1 class="page-title">Products</h1>

<div class="grid">
    {% for product in products %}
        <a href="{% url 'product_detail' product.id %}" class="card">
            <div class="thumb">{{ product.name|first }}</div>
            <div class="card-body">
                <span class="badge badge-category">{{ product.category }}</span>
                <h3>{{ product.name }}</h3>
                <p class="card-price">{{ product.price }} GEL</p>
            </div>
        </a>
    {% empty %}
        <div class="empty">No products yet.</div>
    {% endfor %}
</div>
{% endblock %}
